name: Claude PHASE 1 review

on:
  pull_request:
    types: [labeled]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      vars.FIDEON_CLAUDE_REVIEW_ENABLED == 'true' &&
      github.repository == 'git384291/go' &&
      github.event.label.name == 'claude-review' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.number == 1 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'phase1-product-scope'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, 검증된 커밋 고정
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Claude Action이 비공개 저장소를 다시 fetch할 때 필요하다.
          # contents: read 토큰만 사용하며, checkout의 post 단계에서 정리한다.
          persist-credentials: true
      - name: Require Claude authentication
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo '::error::CLAUDE_CODE_OAUTH_TOKEN must be configured in repository Actions secrets.'
            exit 1
          fi
      - name: Review only
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude-review
          track_progress: true
          include_fix_links: false
          prompt: |
            FIDEON Draft PR #1에 대한 읽기 전용 검토입니다.
            검토 커밋: ${{ github.event.pull_request.head.sha }}
            docs/AUTH-SESSION-FOUNDATION.md와 docs/OPEN-ISSUES.md를 먼저 읽으세요.
            이번 검토는 src/server/auth/staffSession.ts, requireStaff.ts,
            tests/unit/staff-session.test.ts의 DB 인증·원자적 세션 등록 변경에 집중하세요.
            DB 계약 확인은 db/migrations/0001_security.sql의 세션 함수 부분을 읽으세요.
            읽기는 가능하면 묶어서 수행하세요. 실제 결함과 추가 검증 필요 사항을
            코드 경로와 함께 한국어로 설명하세요. 미완료 로그인 UI 전체를 다시 조사하지 마세요.
            코드 변경, 커밋, push, main 병합, 운영 배포, PHASE 2 활성화,
            실제 고객정보 수집은 하지 마세요. 비밀값을 읽거나 출력하지 마세요.
            검토 결과와 검토한 커밋을 이 PR의 진행 댓글에 남기세요.
          # 보안: Claude Action은 실행 중 GitHub 토큰을 .git/config(원격 주소)에 둔다.
          # 파일 읽기 도구로 .git을 읽지 못하게 막아, 저장소 내용에 섞인 지시로 토큰이 댓글에 옮겨지는 경로를 차단한다.
          claude_args: |
            --max-turns 16
            --tools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,Read(./.git/**),Read(./.git)"
